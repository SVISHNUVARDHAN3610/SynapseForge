[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapseforge"
version = "0.1.0"
description = "Agent Memory & Auto-Tool Compiler (FastMCP + LangGraph + Bi-Temporal Fact Graph)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "fastmcp>=0.4.0",
    "langgraph>=0.2.45",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["synapseforge"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
